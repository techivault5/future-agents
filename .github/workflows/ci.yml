name: CI

on:
  push:
    branches: [main]
  # Default pull_request types omit ready_for_review, so a draft marked ready
  # would merge without lint/tests ever running on its newest commits.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check packages/future_agents/ apps/ scripts/
      - run: ruff format --check packages/future_agents/ apps/ scripts/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q
