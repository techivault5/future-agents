[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "future-agents"
version = "0.1.0"
description = "Self-improving multi-agent system with agentic patterns, AI crawler, and IT agent roles"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml~=6.0",
    "packaging~=24.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40.0",
]
# Optional local NLP for semantic memory recall (CPU/GPU/Metal/NPU).
# The default HashingEmbedder needs none of this.
localnlp = [
    "sentence-transformers~=3.0",
    "onnxruntime~=1.18",
]
api = [
    "fastapi~=0.111",
    "uvicorn[standard]~=0.30",
    "python-multipart~=0.0.9",
]
scanning = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]
dev = [
    "httpx~=0.27",
    "beautifulsoup4~=4.12",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist~=3.5",
    "pytest-cov~=5.0",
    # Minor-pinned deliberately: a formatter is only useful if CI and every
    # developer run the same one. ruff 0.16 began formatting Python blocks
    # inside Markdown, which turned a green branch red on an unrelated push.
    # Patches still flow; bumping the minor is a visible, reviewable change.
    "ruff~=0.16.0",
]

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["future_agents*", "guardrails*", "scanning*", "finance_advisor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["packages", "apps", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Document agents use lazy try/except imports for optional heavy deps
"packages/future_agents/agents/pdf_agent.py" = ["F401"]
"packages/future_agents/agents/ppt_agent.py" = ["F401"]
"packages/future_agents/agents/word_agent.py" = ["F401"]
# The handbook is a document: its content is prose in table cells and narrative
# strings, which read worse hard-wrapped at 100 columns than slightly over it.
"packages/future_agents/sdd/handbook/content.py" = ["E501"]
