# Progress narration for Beta Queries.
#
# Edit freely — these strings are never generated by the model, and changing
# them cannot change what the query does. {placeholders} are filled by the
# orchestrator; an unknown placeholder degrades to no detail line rather than
# failing the response.
steps:
  - id: entitlements
    running: "Checking what you can access…"
    done: "{n} data sources available to you"
  - id: route
    running: "Looking for the right data source…"
    done: "Using {datasource} — {why}"
  - id: schema
    running: "Reading table definitions…"
    done: "{n} tables, {joins} joins resolved"
  - id: filters
    running: "Working out which records count…"
    done: "{n} filters applied"
  - id: generate
    running: "Writing the query…"
    done: "Query written"
  - id: guard
    running: "Checking the query is safe and uses base tables…"
    done: "Passed {n} checks"
  - id: execute
    running: "Running it against {datasource}…"
    done: "{rows} rows in {ms} ms"
  - id: answer
    running: "Summarising the result…"
    done: "Done"
