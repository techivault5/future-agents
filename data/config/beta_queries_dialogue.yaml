# Beta Queries — one defined response for every conversational scenario.
#
# Nothing here is generated by the model. That is the point: a chat surface
# that answers "hi" differently every time reads as unreliable even when its
# SQL is perfect, and an inconsistent refusal reads as a bug someone can work
# around. Edit the wording freely — none of it can change what a query does.
#
# {placeholders} are filled by the orchestrator. An unknown placeholder leaves
# the sentence out rather than failing the turn.
#
# mode decides the shape of the turn:
#   run_query         plan and execute (the only mode that calls the model)
#   reuse_plan        re-bind the standing plan — no model call
#   answer_from_state answer from the last plan and its provenance
#   catalog_answer    answer from the catalog, no query
#   clarify           ask, with concrete options — never an open question
#   refuse            decline, say why, offer the nearest thing we can do
#   deflect           redirect to what this actually does
#   acknowledge       short, warm, then get out of the way
#   command           a side effect plus a one-line confirmation
#   repair            something is missing; say exactly what

version: 1

defaults:
  suggestions_max: 3
  # Shown under a refusal or a deflection so the turn ends somewhere useful.
  fallback_suggestions:
    - "How many active employees are there?"
    - "Show headcount by department"
    - "What data can I ask about?"

scenarios:

  # ── data turns ────────────────────────────────────────────────────────────
  new_topic:   { mode: run_query }
  refine:      { mode: run_query }
  pivot:       { mode: reuse_plan }
  drill:       { mode: run_query }
  rollup:      { mode: reuse_plan }
  compare:     { mode: run_query }
  rank:        { mode: run_query }
  trend:       { mode: run_query }
  repeat:
    mode: reuse_plan
    text: "Same question, run again against current data."
  amend:
    mode: reuse_plan
    text: "Updated — {edit}."
  undo:
    mode: reuse_plan
    text: "Removed {edit}. {n} filters still apply."

  # ── answerable without a query ────────────────────────────────────────────
  meta:
    mode: answer_from_state
    text: "{explanation}"
  explain_sql:
    mode: answer_from_state
    text: "Here is the query behind that answer. It reads {tables} and applies {n} filters."
  schema_question:
    mode: catalog_answer
    text: "{summary}"
  capability:
    mode: catalog_answer
    text: >
      I answer questions about your data in plain English. I work out which
      source to use, write the SQL, check it, run it and explain the result —
      and I show you the query and the filters I applied every time.
      You have access to {n} data sources: {sources}.
    suggestions_from: examples
  help:
    mode: catalog_answer
    text: >
      Ask the way you would ask a colleague — "how many active employees in
      India", "headcount by department last quarter", "top 10 customers by
      revenue". Follow-ups work: "and in Germany?", "break that down by team",
      "why is that lower?"
    suggestions_from: examples

  # ── session commands ──────────────────────────────────────────────────────
  reset:
    mode: command
    text: "Cleared. {kept} pinned filters kept — say \"clear everything\" to drop those too."
  export:
    mode: command
    text: "Exporting {rows} rows as {format}."
  feedback:
    mode: command
    text: >
      Noted, thank you — that goes to whoever owns this data. If the number
      looks wrong, the filters I applied are the usual reason: {filters}.

  # ── social ────────────────────────────────────────────────────────────────
  greeting:
    mode: acknowledge
    text: "Hello. Ask me anything about your data — I'll show you the query I run."
    suggestions_from: examples
  thanks:
    mode: acknowledge
    text: "Any time."
  identity:
    mode: deflect
    text: >
      I'm Beta Queries — a text-to-SQL assistant over the databases you have
      access to. I don't know anything outside them.
    suggestions_from: examples
  chitchat:
    mode: deflect
    text: >
      That one's outside my data. I can only answer from the databases you're
      entitled to see.
    suggestions_from: examples

  # ── blocked or incomplete ─────────────────────────────────────────────────
  unsupported_write:
    mode: refuse
    text: >
      I can only read. Every query I run is a single read-only SELECT against a
      replica, and I have no permission to insert, update or delete — by design,
      not by configuration. If data needs changing, that's a job for the owning
      team.
  injection:
    mode: refuse
    text: >
      I'll keep working the way I was set up. Ask me a question about your data
      and I'll answer it.
    log: security
  abuse:
    mode: deflect
    text: >
      Fair enough — something isn't working. Tell me what you expected and I'll
      show you exactly which filters and tables produced the number.
  unresolved_reference:
    mode: repair
    text: >
      I don't have a previous answer to apply that to yet. Ask a full question
      first and then follow up.
    suggestions_from: examples
  multi_intent:
    mode: clarify
    text: "That's {n} questions. Which one first?"
    suggestions_from: parts
  language_other:
    mode: repair
    text: "I can only read English questions at the moment."
  empty:
    mode: repair
    text: "Nothing came through — what would you like to know?"
    suggestions_from: examples
  gibberish:
    mode: repair
    text: "I couldn't read that as a question. Try it the way you'd ask a colleague."
    suggestions_from: examples

  # ── raised by downstream stages, not by the classifier ────────────────────
  out_of_scope:
    mode: refuse
    text: >
      Nothing you have access to covers that. The sources I can see are
      {sources} — if the data exists elsewhere, someone will need to grant you
      access to it first.
  ambiguous_source:
    mode: clarify
    text: "Two sources could answer that. Which do you mean?"
    suggestions_from: candidates
  ambiguous_intent:
    mode: clarify
    text: >
      I couldn't turn that into a query I'd trust. Tell me which of these you
      meant, or say it a different way.
    suggestions_from: examples
  view_not_queryable:
    mode: answer_from_state
    text: >
      {view} is a view, so I don't query it directly — it hides its filters and
      its grain, and a number from it can't be explained. I can answer the same
      question from the tables underneath it: {tables}.
    suggestions_from: examples

  ambiguous_column:
    mode: clarify
    text: "\"{term}\" matches more than one column. Which one?"
    suggestions_from: candidates
  no_rows:
    mode: answer_from_state
    text: >
      No rows matched. The filters applied were {filters} — removing {suspect}
      is usually what's wanted.
  policy_blocked:
    mode: refuse
    text: >
      You can see aggregates of that, not the individual rows. I can give you
      the count, the average or the distribution — which would help?
  execution_error:
    mode: repair
    text: "The query failed to run: {error}. The SQL is in the editor if you want to look."
  timeout:
    mode: repair
    text: >
      That took longer than the {seconds}s limit and was cancelled. Narrowing
      the period or adding a filter usually fixes it.
