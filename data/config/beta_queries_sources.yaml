# Beta Queries — the datasources the crawler visits.
#
# No credentials here. `dsn_env` names an environment variable; the crawler
# reads it at run time and never logs it. Use a read-only catalog principal:
# this crawl reads metadata and samples values, it never answers questions.
#
# `synonyms` is the highest-leverage field in this file. It maps the words
# people say to the words the catalog uses, and it is the difference between
# "how many people" routing to the HR warehouse and routing nowhere.

version: 1

defaults:
  profile_values: true
  max_distinct: 200      # columns with more groups than this are not indexed
  sample_limit: 25       # values kept per column
  max_value_len: 64

sources:
  - id: hrdb
    dialect: sqlserver
    dsn_env: BQ_DSN_HRDB
    description: >
      HR warehouse. Employees, assignments, departments, locations, absence.
      Authoritative for headcount.
    subject_areas: [people, headcount, org, payroll]
    synonyms:
      people: employee
      person: employee
      staff: employee
      headcount: employee
      team: department
      org: department
      joiner: hire
      leaver: termination

  - id: salesdb
    dialect: snowflake
    dsn_env: BQ_DSN_SALESDB
    description: >
      Commercial warehouse. Orders, order lines, invoices, customers, products.
    subject_areas: [revenue, orders, customers, products]
    synonyms:
      revenue: amount
      sales: order
      client: customer
      sku: product

  # Declared FKs are informational on Databricks — joins here come from name
  # inference plus learned co-occurrence, so keep table naming conventional.
  - id: lakehouse
    dialect: databricks
    dsn_env: BQ_DSN_LAKEHOUSE
    description: >
      Event lakehouse. Clickstream, sessions, feature usage.
    subject_areas: [events, usage, telemetry]
    synonyms:
      visit: session
      user: account
